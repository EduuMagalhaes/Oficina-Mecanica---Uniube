<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/usuario.js" defer></script>
    <title>Cadastro de Usuários - Oficina Mecânica</title>
</head>

<body>
    <header>
        <h1>Oficina Mecânica</h1>
    </header>
    <main>
        <h2>Cadastro de Usuários</h2>

        <form id="form-usuario">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" maxlength="150" autocomplete="name" required>

            <label for="email">E-mail / Login</label>
            <input type="email" id="email" name="email" maxlength="254" autocomplete="username" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="new-password" required>

            <label for="tipo">Tipo de usuário</label>
            <select id="tipo" name="tipo" required>
                <option value="">Selecione</option>
                <option value="admin">Administrador</option>
                <option value="mecanico">Mecânico</option>
            </select>

            <button id="btn-usuario" type="submit">Cadastrar usuário</button>
        </form>

        <div id="mensagem" role="status" aria-live="polite"></div>
    </main>
</body>

</html>
