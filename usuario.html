<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/usuario.js" defer></script>
    <script src="js/api.js" defer></script>
    <title>Oficina Mecânica - Cadastro de Usuários</title>
</head>

<body>
    <header>
        <h1>Oficina Mecânica</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="cliente.html">Clientes</a></li>
            <li><a href="veiculo.html">Veículos</a></li>
            <li><a href="mecanico.html">Mecânicos</a></li>
            <li><a href="peca.html">Peças</a></li>
            <li><a href="os.html">Ordem de Serviço</a></li>
            <li><a href="usuario.html" class="ativo">Usuários</a></li>
        </ul>
    </nav>
    <main>
        <h2>Cadastro de Usuários</h2>

        <form id="form-usuario">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" maxlength="150" minlength="2" required>

            <label for="email">E-mail / Login</label>
            <input type="email" autocomplete="email" id="email" name="email" maxlength="254" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" minlength="8" maxlength="30" autocomplete="new-password"
                pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[\W_]).{8,30}"
                title="A senha deve ter entre 8 e 30 caracteres, incluindo letra maiúscula, minúscula, número e caractere especial."
                required>

            <label for="tipo">Tipo de usuário</label>
            <select id="tipo" name="tipo" required>
                <option value="">Selecione</option>
                <option value="admin">Administrador</option>
                <option value="mecanico">Mecânico</option>
            </select>

            <button id="btn-usuario" type="submit">Cadastrar usuário</button>
        </form>

        <div id="mensagem" role="status" aria-live="polite"></div>
    </main>
</body>

</html>
