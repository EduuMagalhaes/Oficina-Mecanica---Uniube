<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js" defer></script>
    <script src="js/mecanico.js" defer></script>
    <script src="js/api.js" defer></script>
    <title>Oficina Mecânica - Mecânicos</title>
</head>

<body>
    <header>
        <h1>Oficina Mecânica</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="cliente.html">Clientes</a></li>
            <li><a href="veiculo.html">Veículos</a></li>
            <li><a href="mecanico.html" class="ativo">Mecânicos</a></li>
            <li><a href="peca.html">Peças</a></li>
            <li><a href="os.html">Ordem de Serviço</a></li>
            <li><a href="usuario.html">Usuários</a></li>
            <li><a href="#" onclick="sair()">Sair</a></li>
        </ul>
    </nav>
    <main>
        <h2>Cadastro de Mecânico</h2>
        <form id="form-mecanico">
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" minlength="2" maxlength="150" placeholder="Digite o nome completo"
                required>

            <label for="especialidade">Especialidade:</label>
            <input type="text" id="especialidade" name="especialidade" placeholder="Ex.: Motor, Freios, Elétrica"
                required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(34) 99999-9999" maxlength="15" required>

            <label for="data_admissao">Data de admissão:</label>
            <input type="date" id="data_admissao" name="data_admissao" required>

            <label for="valor_hora">Valor por hora (R$):</label>
            <input type="number" id="valor_hora" name="valor_hora" min="0" step="0.01" placeholder="Ex.: 45.00"
                required>

            <button id="btn-mecanico" type="submit">Cadastrar</button>
        </form>
        <div id="mensagem"></div>
        <a class="voltar" href="index.html">Voltar à página inicial</a>
    </main>
</body>

</html>
