<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/os.js" defer></script>
    <title>Oficina Mecânica - Ordem de Serviço</title>
</head>

<body>
    <header>
        <h1>Oficina Mecânica</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="cliente.html">Clientes</a></li>
            <li><a href="veiculo.html">Veículos</a></li>
            <li><a href="mecanico.html">Mecânicos</a></li>
            <li><a href="peca.html">Peças</a></li>
            <li><a href="os.html" class="ativo">Ordem de Serviço</a></li>
            <li><a href="usuario.html">Usuários</a></li>
            <li><a href="#" onclick="sair()">Sair</a></li>
        </ul>
    </nav>
    <main>
        <h2>Abertura de Ordem de Serviço</h2>

        <form id="form-os">
            <label for="cliente_nome">Cliente:</label>
            <div class="campo-cliente">
                <input type="text" id="cliente_nome" placeholder="Nenhum cliente selecionado" readonly>
                <button type="button" id="btn-selecionar-cliente">Selecionar</button>
            </div>

            <input type="hidden" id="cliente_id" name="cliente_id">

            <label for="veiculo_nome">Veículo:</label>
            <div class="campo-cliente">
                <input type="text" id="veiculo_nome" placeholder="Nenhum veículo selecionado" readonly>
                <button type="button" id="btn-selecionar-veiculo">Selecionar</button>
            </div>

            <input type="hidden" id="veiculo_id" name="veiculo_id">

            <label for="mecanico_id">Mecânico responsável:</label>
            <select id="mecanico_id" name="mecanico_id" required>
                <option value="">Selecione um mecânico</option>
            </select>

            <label for="entrada">Data de entrada:</label>
            <input type="date" id="entrada" name="entrada" required>

            <label for="defeito">Defeito relatado:</label>
            <textarea id="defeito" name="defeito" rows="4" placeholder="Descreva o problema" required></textarea>

            <label for="status">Status:</label>
            <select id="status" name="status" required>
                <option value="Aberta" selected>Aberta</option>
                <option value="Em andamento">Em andamento</option>
                <option value="Aguardando peça">Aguardando peça</option>
                <option value="Concluída">Concluída</option>
            </select>

            <button type="button" onclick="botaoAbrirOS()">Abrir OS</button>
        </form>

        <div id="mensagem"></div>

        <a class="voltar" href="index.html">Voltar à página inicial</a>

        <div id="modal-cliente" class="modal">
            <div class="modal-conteudo">
                <div class="modal-topo">
                    <h3>Selecionar cliente</h3>
                    <button type="button" id="btn-fechar-modal-cliente">&times;</button>
                </div>

                <input type="text" id="buscar-cliente" placeholder="Buscar pelo nome...">

                <div id="lista-clientes"></div>
            </div>
        </div>

        <div id="modal-veiculo" class="modal">
            <div class="modal-conteudo">
                <div class="modal-topo">
                    <h3>Selecionar veículo</h3>
                    <button type="button" id="btn-fechar-modal-veiculo">&times;</button>
                </div>

                <input type="text" id="buscar-veiculo" placeholder="Buscar pela placa...">

                <div id="lista-veiculos"></div>
            </div>
        </div>
    </main>
</body>

</html>
